<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0d1b4b"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0"/>
      <stop offset="40%" stop-color="#f5c842" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  <!-- Фон со скруглением и прозрачностью снаружи -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Золотая дуга как на оригинале -->
  <path d="M 100 320 A 200 200 0 0 1 210 110" stroke="url(#arc)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#glow)" clip-path="url(#rounded)"/>
  <!-- Текст САУ белый как на оригинале -->
  <text x="265" y="330" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="205" font-weight="900" fill="white" letter-spacing="-6" clip-path="url(#rounded)">САУ</text>
</svg>
